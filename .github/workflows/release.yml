name: Release

# Publishes to PyPI when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag's number must match pyproject.toml's [project].version, or PyPI
# will reject the upload as a duplicate/mismatched version.
#
# One-time setup before this can run: on pypi.org, under the forgefy-cli
# project's "Publishing" settings, add a Trusted Publisher for this repo
# (Polybamz/forgefy-cli), workflow file "release.yml", environment "pypi".
# No PyPI token/secret is needed — GitHub's OIDC token proves the identity.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
