[project]
name = "forgefy-cli"
version = "0.1.0"
description = "Forgefy CLI — coding assistance with local and hosted model-provider profiles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
forgefy = "forgefy_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
